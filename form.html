
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clover Tech Fest Registration</title>
</head>

<body>

    <!-- Main Registration Form -->
    <main>

        <header>
            <a href="Event.html">Home</a>
            <a href="work.html">Event</a>
            <a href="form.html#r">Register</a>

            <h1 id="r">Clover Kingdom Fest 2026</h1>
            <p>Register now and be a part of the technology revolution!</p>
        </header>

        <!-- Registration Section -->
        <section>

            <h2>Student Registration Form</h2>

            <form action="#" method="post">

                <!-- Personal Information -->
                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name"
                        placeholder="Enter your full name" required>
                    <br><br>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email"
                        placeholder="Enter your email" required>
                    <br><br>

                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone"
                        placeholder="Enter your phone number" required>
                    <br><br>

                    <label for="college">College Name:</label>
                    <input type="text" id="college" name="college"
                        placeholder="Enter your college name" required>
                    <br><br>

                    <label for="year">Year of Study:</label>
                    <select id="year" name="year" required>
                        <option value="">Select your year</option>
                        <option value="1st">1st Year</option>
                        <option value="2nd">2nd Year</option>
                        <option value="3rd">3rd Year</option>
                        <option value="4th">4th Year</option>
                    </select>

                </fieldset>

                <br>

                <!-- Event Selection -->
                <fieldset>
                    <legend>Event Selection</legend>

                    <p>Select your event:</p>

                    <input type="checkbox" id="hackathon" name="event" value="Hackathon">
                    <label for="hackathon">Hackathon</label>
                    <br>

                    <input type="checkbox" id="coding" name="event" value="Coding">
                    <label for="coding">Coding Competition</label>
                    <br>

                    <input type="checkbox" id="robotics" name="event" value="Robotics">
                    <label for="robotics">Robotics</label>
                    <br>

                    <input type="checkbox" id="gaming" name="event" value="Gaming">
                    <label for="gaming">Gaming Competition</label>

                </fieldset>

                <br>

                <!-- Additional Information -->
                <fieldset>
                    <legend>Additional Information</legend>

                    <label for="message">Why do you want to participate?</label>
                    <br>

                    <textarea id="message" name="message"
                        rows="4" cols="40"
                        placeholder="Tell us about your interests..."></textarea>

                </fieldset>

                <br>

                <!-- Form Submission -->
                <button type="submit">Register Now</button>
                <button type="reset">Reset Form</button>

            </form>

        </section>

        <!-- Footer -->
        <footer>
            <p>© 2026 Clover Tech Fest. All Rights Reserved.</p>
        </footer>

    </main>

</body>
</html>
